name: Build frontend theme
description: Clone komari-web, build the default theme, and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "24.22.1"
  repository:
    description: komari-web repository URL.
    default: https://github.com/musicclub1563/komari-web
  ref:
    description: >-
      komari-web commit SHA, branch, or tag to build. Leave empty to use the
      pinned commit that contains the dependency security fixes.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: true

    - name: Verify Node.js and npm versions
      shell: bash
      run: |
        set -euxo pipefail
        expected="v${{ inputs.node-version }}"
        node_version="$(node --version)"
        npm_version="$(npm --version)"
        echo "node --version: $node_version"
        echo "npm --version: $npm_version"
        if [ "$node_version" != "$expected" ]; then
          echo "Node.js version mismatch: expected $expected but got $node_version" >&2
          exit 1
        fi

    - name: Install zstd
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Clone and build frontend
      shell: bash
      run: |
        set -euxo pipefail
        REPO="${{ inputs.repository }}"
        # Single source of truth for the verified komari-web commit. Keeping it
        # here means an empty ref still builds the pinned frontend instead of
        # falling back to the repository default branch.
        PINNED_REF="2675059ce88979630633527f6e42774c1dabb006"
        REF="${{ inputs.ref }}"
        REF="${REF:-$PINNED_REF}"
        rm -rf komari-web
        if [ -n "$REF" ]; then
          # Pinned refs are usually commit SHAs, which `git clone --branch`
          # cannot check out. Fetch the ref explicitly and fall back to a
          # branch/tag clone when the server refuses a direct SHA fetch.
          git init -q komari-web
          git -C komari-web remote add origin "$REPO"
          if git -C komari-web fetch --depth=1 origin "$REF"; then
            git -C komari-web checkout -q --detach FETCH_HEAD
          else
            rm -rf komari-web
            git clone --depth=1 --branch "$REF" "$REPO" komari-web
          fi
        else
          git clone --depth=1 "$REPO" komari-web
        fi
        cd komari-web
        resolved_sha=$(git rev-parse HEAD)
        echo "komari-web commit: $resolved_sha"
        if [[ "$REF" =~ ^[0-9a-f]{40}$ ]] && [ "$resolved_sha" != "$REF" ]; then
          echo "komari-web ref mismatch: expected $REF but checked out $resolved_sha" >&2
          exit 1
        fi
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npm run build
        cd ..

        mkdir -p web/public/defaultTheme
        rm -rf web/public/defaultTheme/dist web/public/defaultTheme/dist.tar.zst
        test -f komari-web/dist/index.html
        tar -cf "$RUNNER_TEMP/komari-default-dist.tar" -C komari-web/dist .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-default-dist.tar" -o web/public/defaultTheme/dist.tar.zst
        rm -f "$RUNNER_TEMP/komari-default-dist.tar"
        cp -f komari-web/komari-theme.json web/public/defaultTheme/
        if [ -f komari-web/preview.png ]; then cp -f komari-web/preview.png web/public/defaultTheme/; fi
        if [ -f komari-web/perview.png ]; then cp -f komari-web/perview.png web/public/defaultTheme/; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
