name: Build frontend theme
description: Clone komari-web, build the default theme, and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build komari-web.
    default: "24.22.1"
  repository:
    description: komari-web repository URL.
    default: https://github.com/musicclub1563/komari-web
  ref:
    description: >-
      komari-web commit SHA, branch, or tag to build. Leave empty to use the
      pinned commit recorded in the resolve step below.
    default: ""
  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

outputs:
  commit:
    description: The resolved komari-web commit SHA that produced the theme.
    value: ${{ steps.frontend.outputs.sha }}
  cache-hit:
    description: Whether the packed theme was restored from cache.
    value: ${{ steps.theme-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        check-latest: true

    - name: Verify Node.js and npm versions
      shell: bash
      run: |
        set -euxo pipefail
        expected="v${{ inputs.node-version }}"
        node_version="$(node --version)"
        npm_version="$(npm --version)"
        echo "node --version: $node_version"
        echo "npm --version: $npm_version"
        if [ "$node_version" != "$expected" ]; then
          echo "Node.js version mismatch: expected $expected but got $node_version" >&2
          exit 1
        fi

    - name: Resolve frontend commit
      id: frontend
      shell: bash
      env:
        # Single source of truth for the verified komari-web commit. Keeping it
        # here means an empty ref still builds the pinned frontend instead of
        # falling back to the repository default branch.
        # radix head: svg icon XSS fix, HTML sanitisation, PWA cache of
        # authenticated responses removed, office preview consent.
        PINNED_REF: "b5ba6ded6e903f60e813f89e97c07c90579df333"
        INPUT_REF: ${{ inputs.ref }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euxo pipefail
        ref="${INPUT_REF:-$PINNED_REF}"
        if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
          sha="$ref"
        else
          sha="$(git ls-remote "$REPO" "$ref" | head -n1 | cut -f1)"
          if [ -z "$sha" ]; then
            echo "Unable to resolve komari-web ref '$ref' in $REPO" >&2
            exit 1
          fi
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "Resolved komari-web ref $ref -> $sha"

    - name: Restore packed theme cache
      id: theme-cache
      uses: actions/cache/restore@v4
      with:
        path: web/public/defaultTheme
        # The key covers the frontend commit, the Node toolchain, and the action
        # definition (clone/pack logic), so a changed theme input never reuses an
        # older theme.
        key: komari-frontend-${{ runner.os }}-${{ steps.frontend.outputs.sha }}-node${{ inputs.node-version }}-${{ hashFiles('.github/actions/build-frontend/action.yml') }}

    - name: Install zstd
      if: steps.theme-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Clone frontend
      if: steps.theme-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        REPO: ${{ inputs.repository }}
        SHA: ${{ steps.frontend.outputs.sha }}
      run: |
        set -euxo pipefail
        rm -rf komari-web
        # Pinned refs are commit SHAs, which `git clone --branch` cannot check
        # out, so fetch the exact commit and verify it afterwards.
        git init -q komari-web
        git -C komari-web remote add origin "$REPO"
        git -C komari-web fetch --depth=1 origin "$SHA"
        git -C komari-web checkout -q --detach FETCH_HEAD
        resolved_sha="$(git -C komari-web rev-parse HEAD)"
        echo "komari-web commit: $resolved_sha"
        if [ "$resolved_sha" != "$SHA" ]; then
          echo "komari-web ref mismatch: expected $SHA but checked out $resolved_sha" >&2
          exit 1
        fi

    - name: Restore npm download cache
      if: steps.theme-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: ~/.npm/_cacache
        key: npm-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('komari-web/package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-node${{ inputs.node-version }}-

    - name: Install dependencies and build theme
      if: steps.theme-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euxo pipefail
        cd komari-web
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npm run build
        cd ..

        mkdir -p web/public/defaultTheme
        rm -rf web/public/defaultTheme/dist web/public/defaultTheme/dist.tar.zst
        test -f komari-web/dist/index.html
        tar -cf "$RUNNER_TEMP/komari-default-dist.tar" -C komari-web/dist .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-default-dist.tar" -o web/public/defaultTheme/dist.tar.zst
        rm -f "$RUNNER_TEMP/komari-default-dist.tar"
        cp -f komari-web/komari-theme.json web/public/defaultTheme/
        if [ -f komari-web/preview.png ]; then cp -f komari-web/preview.png web/public/defaultTheme/; fi
        if [ -f komari-web/perview.png ]; then cp -f komari-web/perview.png web/public/defaultTheme/; fi
        if [ -f web/public/defaultTheme/preview.png ] && [ ! -f web/public/defaultTheme/perview.png ]; then cp -f web/public/defaultTheme/preview.png web/public/defaultTheme/perview.png; fi
        if [ -f web/public/defaultTheme/perview.png ] && [ ! -f web/public/defaultTheme/preview.png ]; then cp -f web/public/defaultTheme/perview.png web/public/defaultTheme/preview.png; fi

    - name: Validate restored theme
      if: steps.theme-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euxo pipefail
        test -s web/public/defaultTheme/dist.tar.zst
        test -s web/public/defaultTheme/komari-theme.json
        echo "Restored packed theme from cache (frontend commit ${{ steps.frontend.outputs.sha }})"

    - name: Save packed theme cache
      if: steps.theme-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: web/public/defaultTheme
        key: komari-frontend-${{ runner.os }}-${{ steps.frontend.outputs.sha }}-node${{ inputs.node-version }}-${{ hashFiles('.github/actions/build-frontend/action.yml') }}

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
