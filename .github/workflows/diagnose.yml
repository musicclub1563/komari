name: Diagnose jsruntime test failure

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  current-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Reproduce on current branch
        run: |
          id
          ls -ld /tmp
          go test ./pkg/jsruntime -run "TestNodeCoreModulesAndECMAScriptBuiltins|TestStorageDirIsConfinedAdditionalRoot" -count=1 -v || true
      - name: Inspect temp dir permissions
        if: always()
        run: |
          ls -ld /tmp/Test* 2>/dev/null || true
          find /tmp -maxdepth 4 -name data -o -maxdepth 4 -name plugin-data 2>/dev/null | head -20 || true

  upstream-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 528cea2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Reproduce on upstream main (Go 1.25.0)
        run: |
          go version
          go test ./pkg/jsruntime -run "TestNodeCoreModulesAndECMAScriptBuiltins|TestStorageDirIsConfinedAdditionalRoot" -count=1 -v || true

  go-1-26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Reproduce on current branch with Go 1.26.10
        run: |
          go version
          go test ./pkg/jsruntime -run "TestNodeCoreModulesAndECMAScriptBuiltins|TestStorageDirIsConfinedAdditionalRoot" -count=1 -v || true
