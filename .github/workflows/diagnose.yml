name: Diagnose jsruntime test failure

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  minimal-osroot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goversion: ["1.25.0", "1.26.10", "1.27.3"]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goversion }}
      - name: Minimal os.Root create test
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          cat > /tmp/osroot.go <<'EOF'
          package main

          import (
          	"fmt"
          	"os"
          	"path/filepath"
          )

          func main() {
          	dir, _ := os.MkdirTemp("", "root")
          	defer os.RemoveAll(dir)
          	r, err := os.OpenRoot(dir)
          	if err != nil {
          		fmt.Println("OpenRoot:", err)
          		return
          	}
          	defer r.Close()
          	fmt.Println("MkdirAll:", r.MkdirAll("data", 0o777))
          	info, e := os.Stat(filepath.Join(dir, "data"))
          	if e == nil {
          		fmt.Println("data mode:", info.Mode())
          	}
          	f, err := r.OpenFile("data/sync.txt", os.O_CREATE|os.O_WRONLY|os.O_TRUNC, 0o666)
          	fmt.Println("OpenFile create:", err)
          	if err == nil {
          		f.WriteString("x")
          		f.Close()
          	}
          	f2, err := r.OpenFile("data/sync.txt", os.O_RDONLY, 0)
          	fmt.Println("OpenFile read:", err)
          	if err == nil {
          		f2.Close()
          	}
          }
          EOF
          go run /tmp/osroot.go

  current-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Reproduce on current branch
        run: |
          go version
          go test ./pkg/jsruntime -run "TestNodeCoreModulesAndECMAScriptBuiltins|TestStorageDirIsConfinedAdditionalRoot" -count=1 -v || true

  upstream-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 528cea23be11708fa9fffee0919e7885791460cb
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Reproduce on upstream main (Go 1.25.0)
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go test ./pkg/jsruntime -run "TestNodeCoreModulesAndECMAScriptBuiltins|TestStorageDirIsConfinedAdditionalRoot" -count=1 -v || true
