name: Build Binaries on PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push to the same PR cancels the previous run instead of queueing behind it.
concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  ZIG_VERSION: "0.14.1"

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

  # Downloads modules once per run so the matrix and test jobs restore the same
  # module cache instead of racing to save one shared key.
  go-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Download Go modules
        if: steps.go-mod-cache.outputs.cache-hit != 'true'
        run: go mod download

  test:
    needs: [build-frontend, go-modules]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Restore Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          go-version: ${{ env.GO_VERSION }}
          zig-version: ${{ env.ZIG_VERSION }}
          goos: linux
          goarch: amd64

      - name: Run vet and tests
        run: |
          go vet ./...
          go test ./... -count=1

      # The spawn/output bugs were Linux-specific, so repeat the regression
      # cases here instead of relying on a single run or a local Windows pass.
      - name: Repeat child_process regressions
        run: |
          go test ./pkg/jsruntime -run '^TestChildProcessPermissionAndExecution$' -count=100
          go test ./pkg/jsruntime -count=3 -v -run 'TestSpawnExitPrecedesCloseWhenBackgroundHoldsPipes|TestExecFileSyncMaxBufferTerminatesChild|TestRuntimeCloseTerminatesTimedOutSyncChild|TestRuntimeCloseTerminatesSpawnedChild|TestSpawnLargeOutputAndExitOrdering|TestSpawnNonZeroExitOrdering'

      - name: Save Go build cache
        if: steps.go-cache.outputs.build-cache-hit != 'true'
        uses: ./.github/actions/go-cache
        with:
          mode: save
          go-version: ${{ env.GO_VERSION }}
          zig-version: ${{ env.ZIG_VERSION }}
          goos: linux
          goarch: amd64

  # PRs verify the two most common targets; releases keep the full matrix.
  build-binaries:
    needs: [build-frontend, go-modules]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target_triple: x86_64-linux-musl
            binary_extension: ""
          - goos: windows
            goarch: amd64
            zig_target_triple: x86_64-windows-gnu
            binary_extension: .exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore frontend artifact
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Zig cross-compiler toolchain
        uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Restore Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          go-version: ${{ env.GO_VERSION }}
          zig-version: ${{ env.ZIG_VERSION }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: zig cc -target ${{ matrix.zig_target_triple }}
          GIN_MODE: release
        run: |
          BINARY_NAME=komari-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.binary_extension }}" != "" ]; then
            BINARY_NAME=${BINARY_NAME}${{ matrix.binary_extension }}
          fi
          VERSION="${{ github.sha }}"
          VERSION_HASH="${{ github.sha }}"
          LDFLAGS="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=${VERSION} -X github.com/komari-monitor/komari/utils.VersionHash=${VERSION_HASH}"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            LDFLAGS="$LDFLAGS -extldflags=-Wl,--strip-all"
          fi
          go build -trimpath -ldflags="$LDFLAGS" -o "$BINARY_NAME"

      - name: Save Go build cache
        if: steps.go-cache.outputs.build-cache-hit != 'true'
        uses: ./.github/actions/go-cache
        with:
          mode: save
          go-version: ${{ env.GO_VERSION }}
          zig-version: ${{ env.ZIG_VERSION }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-${{ matrix.goos }}-${{ matrix.goarch }}*
